# SPDX-License-Identifier: AGPL-3.0-only
# Fork-only, disposable reproduction. This replaces this workflow only on the
# mimir-desktop-806-807-20260909 topic branch, never on upstream/default branches.
name: Official Desktop 806 to 807 timing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-806-807-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.repository == 'wasimysaid/unsloth'
    name: Official 806 to 807 (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Validate harness and install driver dependencies (no package cache)
        run: |
          python -m py_compile tests/studio/upgrade_806_807/*.py
          python -m unittest discover -s tests/studio/upgrade_806_807 -p test_harness.py -v
          python -m pip install --no-cache-dir 'playwright==1.58.0' 'psutil==7.2.2'
      - name: Linux native WebDriver prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth webkit2gtk-driver libwebkit2gtk-4.1-0 libfuse2 \
            libgles2 libgl1 libegl1 libgbm1 libwayland-client0 libharfbuzz0b \
            libnghttp2-14 fontconfig libfribidi0 libappindicator3-1 \
            libcurl4-openssl-dev libssl-dev fonts-noto-color-emoji
          cargo install tauri-driver --version 2.0.6 --locked
      - name: Install official 806 and run its native update to 807
        timeout-minutes: 75
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a --server-args='-screen 0 1440x900x24' \
              python tests/studio/upgrade_806_807/run_upgrade.py --artifacts "$GITHUB_WORKSPACE/upgrade-evidence"
          else
            python tests/studio/upgrade_806_807/run_upgrade.py --artifacts "$GITHUB_WORKSPACE/upgrade-evidence"
          fi
      - name: Collect and redact native logs even after a failure
        if: always()
        run: |
          python tests/studio/upgrade_806_807/run_upgrade.py \
            --artifacts "$GITHUB_WORKSPACE/upgrade-evidence" --collect-only
      - name: Publish timing summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('upgrade-evidence/public')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              print('## Official 806 → 807 desktop upgrade', file=out)
              print('Official signed release binaries; existing published Python packages; no source rebuild.', file=out)
              print('Bootstrap constrained to unsloth 2026.9.2 / zoo 2026.9.1; constraints removed before native launch.', file=out)
              p = root / 'timings.json'
              if p.exists():
                  print('\n| Phase | Seconds | Exit |\n|---|---:|---:|', file=out)
                  for event in json.loads(p.read_text()):
                      print(f"| {event['phase']} | {event['seconds']} | {event['exit_code']} |", file=out)
              for p in sorted(root.glob('cache-*.json')):
                  print(f'\n### {p.stem}\n```json\n{p.read_text()}\n```', file=out)
              print('\nSee native driver result and timestamped phase logs in the artifact. A blocked driver is NOT a successful native upgrade.', file=out)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-806-807-${{ matrix.label }}
          path: upgrade-evidence/public/
          if-no-files-found: warn
          retention-days: 7
