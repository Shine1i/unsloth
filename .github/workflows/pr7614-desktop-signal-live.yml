# SPDX-License-Identifier: AGPL-3.0-only
# Disposable live proof for unslothai/unsloth#7614. Delete with the staging branch.
name: PR 7614 Desktop Signal Live E2E

on:
  push:
    branches:
      - 'pr-7614-desktop-unix-cleanup-repro-ci-*'
      - 'pr-7614-desktop-unix-cleanup-negative-ci-*'
  workflow_dispatch:

concurrency:
  group: pr-7614-desktop-signal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-live-signals:
    name: Ubuntu live Tauri + real backend signals
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 jq libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf procps x11-utils xvfb

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1
        with:
          workspaces: studio/src-tauri -> target

      - name: Audit and build frontend
        run: |
          python3 scripts/lockfile_supply_chain_audit.py
          npm ci --prefix studio --no-fund --no-audit
          npm ci --prefix studio/frontend --no-fund --no-audit
          npm --prefix studio/frontend run build
          test -f studio/frontend/dist/index.html

      - name: Install real Studio backend from this checkout
        env:
          UNSLOTH_SKIP_AUTOSTART: '1'
          UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log
          test -x "$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"

      - name: Build Tauri desktop binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npx --prefix studio tauri build --debug --no-bundle
          test -x studio/src-tauri/target/debug/unsloth-studio

      - name: Live E2E — termination signals reap the real backend
        env:
          UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          OWNER="$HOME/.unsloth/studio/run/desktop_backend.json"
          BIN="$GITHUB_WORKSPACE/studio/src-tauri/target/debug/unsloth-studio"
          XVFB_PID=''
          APP_WRAPPER_PID=''
          APP_PID=''
          BACKEND_PID=''
          UNRELATED_PID=''

          cleanup() {
            set +e
            [ -n "$APP_PID" ] && kill -KILL "$APP_PID" 2>/dev/null
            [ -n "$APP_WRAPPER_PID" ] && kill -KILL "$APP_WRAPPER_PID" 2>/dev/null
            [ -n "$BACKEND_PID" ] && kill -KILL -- "-$BACKEND_PID" 2>/dev/null
            [ -n "$UNRELATED_PID" ] && kill -TERM "$UNRELATED_PID" 2>/dev/null
            [ -n "$XVFB_PID" ] && kill -TERM "$XVFB_PID" 2>/dev/null
          }
          trap cleanup EXIT

          Xvfb :99 -screen 0 1280x800x24 >logs/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          for _ in $(seq 1 50); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo -display :99 >/dev/null

          # A listener outside Studio's process group must survive every cleanup.
          unrelated_port=$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(('127.0.0.1', 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )
          python3 -m http.server "$unrelated_port" --bind 127.0.0.1 >logs/unrelated.log 2>&1 &
          UNRELATED_PID=$!
          for _ in $(seq 1 50); do
            curl -fsS "http://127.0.0.1:$unrelated_port/" >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -fsS "http://127.0.0.1:$unrelated_port/" >/dev/null

          run_signal_case() {
            local signal="$1"
            local case_log="logs/tauri-${signal}.log"
            rm -f "$OWNER"
            APP_PID=''
            BACKEND_PID=''

            dbus-run-session -- "$BIN" >"$case_log" 2>&1 &
            APP_WRAPPER_PID=$!

            local deadline=$((SECONDS + 180))
            local port=''
            while [ "$SECONDS" -lt "$deadline" ]; do
              if [ -f "$OWNER" ]; then
                APP_PID=$(jq -r '.app_pid // empty' "$OWNER" 2>/dev/null || true)
                BACKEND_PID=$(jq -r '.backend_pid // empty' "$OWNER" 2>/dev/null || true)
                port=$(jq -r '.port // empty' "$OWNER" 2>/dev/null || true)
                if [ -n "$APP_PID" ] && [ -n "$BACKEND_PID" ] && [ -n "$port" ] \
                  && kill -0 "$APP_PID" 2>/dev/null && kill -0 "$BACKEND_PID" 2>/dev/null \
                  && curl -fsS "http://127.0.0.1:$port/api/liveness" >/dev/null 2>&1; then
                  break
                fi
              fi
              if ! kill -0 "$APP_WRAPPER_PID" 2>/dev/null; then
                echo "FAIL $signal: desktop exited before its backend became healthy"
                cat "$case_log"
                return 1
              fi
              sleep 0.5
            done

            if [ -z "$APP_PID" ] || [ -z "$BACKEND_PID" ] || [ -z "$port" ]; then
              echo "FAIL $signal: timed out waiting for desktop ownership metadata"
              cat "$case_log"
              return 1
            fi
            kill -0 "$APP_PID"
            kill -0 "$BACKEND_PID"
            curl -fsS "http://127.0.0.1:$port/api/liveness" \
              | jq -e '.service == "Unsloth UI Backend" and .desktop_owner.kind == "tauri" and .supports_desktop_backend_ownership == true' \
              >/dev/null
            test "$(ps -o pgid= -p "$BACKEND_PID" | tr -d ' ')" = "$BACKEND_PID"
            jq '{schema_version,kind,app_pid,backend_pid,generation,requested_port,port,studio_root_id,started_at_ms,updated_at_ms}' \
              "$OWNER" >"logs/owner-${signal}-sanitized.json"

            echo "LIVE $signal app_pid=$APP_PID backend_pid=$BACKEND_PID port=$port"
            kill -s "$signal" "$APP_PID"

            set +e
            wait "$APP_WRAPPER_PID"
            local status=$?
            set -e
            APP_WRAPPER_PID=''
            # Tauri handles a watched signal through AppHandle::exit; the Rust
            # main function can therefore return 0 even though the requested code
            # is 128+signal. The cleanup assertions below are the behavior under test.

            deadline=$((SECONDS + 30))
            while [ "$SECONDS" -lt "$deadline" ] && kill -0 "$BACKEND_PID" 2>/dev/null; do
              sleep 0.2
            done
            if kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "FAIL $signal: backend $BACKEND_PID survived desktop termination"
              ps -ef --forest
              return 1
            fi
            if [ -e "$OWNER" ]; then
              echo "FAIL $signal: owner metadata survived cleanup"
              return 1
            fi
            if curl -fsS --max-time 1 "http://127.0.0.1:$port/api/liveness" >/dev/null 2>&1; then
              echo "FAIL $signal: backend port $port is still serving"
              return 1
            fi
            if ! grep -q "Received Unix termination signal SIG${signal}" "$case_log"; then
              echo "FAIL $signal: signal listener evidence missing from log"
              cat "$case_log"
              return 1
            fi
            curl -fsS "http://127.0.0.1:$unrelated_port/" >/dev/null
            echo "PASS $signal: desktop status=$status, backend reaped, port free, owner removed, unrelated listener alive"
            APP_PID=''
            BACKEND_PID=''
          }

          run_signal_case TERM
          run_signal_case INT
          run_signal_case QUIT
          run_signal_case HUP
          echo 'PASS live Tauri E2E: all Unix termination signals cleaned up the real Studio backend'

      - name: Upload live E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-7614-desktop-signal-live-evidence
          path: logs/
          retention-days: 14
          if-no-files-found: warn
