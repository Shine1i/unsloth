name: "staging-9981 windows-latest"
on:
  push:
    branches: ["pr-9981-mimir-pr9981-20260831t105605z-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: Backend RAG coupling regression
        run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_rag_nudge_coupling.py -q --tb=short
      - name: Frontend RAG scope regression
        run: node --experimental-strip-types --test studio/frontend/tests/rag-web-search-coupling.test.ts
