# Disposable repro workflow. Delete after validation.

name: "PR 7628 macOS Icon Live E2E"

on:
  push:
    branches:
      - "pr-7628-macos-icon-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-14"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Use an isolated consumer home"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr7628-home" logs
          echo "HOME=$RUNNER_TEMP/pr7628-home" >> "$GITHUB_ENV"
          echo "UNSLOTH_SKIP_AUTOSTART=1" >> "$GITHUB_ENV"

      - name: "Install the PR checkout end to end"
        shell: bash
        run: |
          set -euo pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/macos-install.log
          echo 'PASS macOS local installer completed'

      - name: "Verify the generated app uses the prebuilt ICNS"
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/Applications/Unsloth Studio.app"
          SRC="$GITHUB_WORKSPACE/studio/src-tauri/icons/icon.icns"
          DST="$APP/Contents/Resources/AppIcon.icns"
          test -x "$APP/Contents/MacOS/launch-studio"
          test -f "$DST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")" = AppIcon
          cmp "$SRC" "$DST"
          file "$DST" | tee logs/macos-icon-file.txt
          sips -g pixelWidth -g pixelHeight "$DST" | tee logs/macos-icon-size.txt
          rm -rf logs/AppIcon.iconset
          iconutil -c iconset -o logs/AppIcon.iconset "$DST"
          find logs/AppIcon.iconset -type f -maxdepth 1 -print | sort | tee logs/macos-icon-members.txt
          find logs/AppIcon.iconset -type f -name '*512x512@2x.png' | grep -q .
          echo 'PASS generated .app copied the prebuilt ICNS byte-for-byte and exposes a 1024px representation'

      - name: "Launch the installed Studio and reach health"
        shell: bash
        run: |
          set -euo pipefail
          PORT=8897
          "$HOME/.local/bin/unsloth" studio -H 127.0.0.1 -p "$PORT" > logs/macos-studio.log 2>&1 &
          PID=$!
          cleanup() { kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 180); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" > logs/macos-health.json 2>/dev/null; then
              cat logs/macos-health.json
              echo 'PASS installed macOS Studio reached /api/health'
              exit 0
            fi
            kill -0 "$PID" 2>/dev/null || { tail -100 logs/macos-studio.log; exit 1; }
            sleep 1
          done
          tail -100 logs/macos-studio.log
          echo 'FAIL installed macOS Studio did not become healthy'
          exit 1

      - name: "Force an ICNS copy error and verify fallback"
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/Applications/Unsloth Studio.app"
          DST="$APP/Contents/Resources/AppIcon.icns"
          rm -f "$DST"
          mkdir -p "$RUNNER_TEMP/pr7628-fakebin"
          cat > "$RUNNER_TEMP/pr7628-fakebin/cp" <<'SH'
          #!/bin/sh
          case "${1:-}" in
            */studio/src-tauri/icons/icon.icns) echo 'forced ICNS cp failure' >&2; exit 1 ;;
          esac
          exec /bin/cp "$@"
          SH
          chmod +x "$RUNNER_TEMP/pr7628-fakebin/cp"
          PATH="$RUNNER_TEMP/pr7628-fakebin:$PATH" bash install.sh --local --no-torch 2>&1 | tee logs/macos-fallback-install.log
          file "$DST" | tee logs/macos-fallback-icon-file.txt
          if file "$DST" | grep -q 'Mac OS X icon'; then
            echo 'PASS failed prebuilt copy fell back to sips/iconutil'
          else
            echo 'FAIL failed prebuilt copy skipped sips/iconutil and produced a non-ICNS fallback'
            exit 1
          fi


      - name: "Upload macOS icon E2E evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr7628-macos-icon-live-evidence
          path: logs
          if-no-files-found: warn
          retention-days: 7

