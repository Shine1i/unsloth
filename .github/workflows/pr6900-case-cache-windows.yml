# Disposable repro workflow. Delete after validation.

name: "PR 6900 Case Cache Repro Windows"

on:
  push:
    branches:
      - "pr-6900-case-cache-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused test dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest typer click rich pydantic pyyaml requests tomli huggingface_hub httpx aiohttp fastapi starlette structlog

      - name: "Run unsloth start case handling tests"
        shell: pwsh
        run: |
          python -m pytest -q unsloth_cli/tests/test_start.py::test_connect_codex_matches_requested_model_case_insensitively unsloth_cli/tests/test_start.py::test_resolve_model_matches_loaded_canonical_case_after_load unsloth_cli/tests/test_start.py::test_resolve_model_loads_when_catalog_hit_is_not_loaded unsloth_cli/tests/test_start.py::test_resolve_model_attaches_to_loaded_catalog_hit_without_reload unsloth_cli/tests/test_start.py::test_resolve_model_remote_studio_does_not_casefold_attach unsloth_cli/tests/test_start.py::test_model_id_matching_does_not_casefold_local_paths

      - name: "Run Studio offline GGUF cache regression tests"
        shell: pwsh
        run: |
          python -m pytest -q studio/backend/tests/test_offline_gguf_cache_fallback.py

