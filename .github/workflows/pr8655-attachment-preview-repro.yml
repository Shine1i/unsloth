# Disposable live Studio repro workflow. Delete after validation.

name: "PR 8655 Attachment Preview A/B"

on:
  push:
    branches:
      - "feat/pr-8655-attachment-preview-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Attachment A/B (${{ matrix.case }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: before-edge
            os: windows-latest
            browser: msedge
            ref: 44afbdfc536a5494b0c63e10318aa329c81f3111
            expect_preview: "0"
          - case: after-edge
            os: windows-latest
            browser: msedge
            ref: feat/pr-8655-attachment-preview-ci
            expect_preview: "1"
          - case: after-chrome
            os: windows-latest
            browser: chrome
            ref: feat/pr-8655-attachment-preview-ci
            expect_preview: "1"
          - case: after-macos-webkit
            os: macos-latest
            browser: webkit
            ref: feat/pr-8655-attachment-preview-ci
            expect_preview: "1"
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.case }}
      STUDIO_BROWSER: ${{ matrix.browser }}
      STUDIO_CASE: ${{ matrix.case }}
      STUDIO_EXPECT_PREVIEW: ${{ matrix.expect_preview }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check out the exact subject revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: wasimysaid/unsloth
          ref: ${{ matrix.ref }}
          path: subject
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13"
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            python -m playwright install "${{ matrix.browser }}"
          else
            echo "Using the branded browser already installed on the Windows runner"
          fi

      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          Push-Location subject
          & ./install.ps1 --local --no-torch
          Pop-Location

      - name: Install Studio from this branch (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          cd subject
          bash ./install.sh --local --no-torch

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr8655-attachment-preview-repro-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr8655-${{ matrix.case }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
