# Disposable repro workflow. Delete after validation.

name: "PR 9944 Repro - macOS"

on:
  push:
    branches:
      - "pr-9944-trainer-kwarg-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "macos-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install pinned supported dependencies"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.7.1' 'transformers==4.57.6' 'trl==0.24.0' 'datasets==4.3.0' 'accelerate>=1.0' packaging

      - name: "Materialize latest-main trainer source"
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          mkdir -p ../pr9944-base/unsloth
          git show origin/main:unsloth/trainer.py > ../pr9944-base/unsloth/trainer.py
          git rev-parse origin/main
          git rev-parse HEAD

      - name: "Run PR 9944 A/B compatibility probe"
        shell: bash
        run: |
          python .github/repro/pr9944_wrapper_probe.py ../pr9944-base .
