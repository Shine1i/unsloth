# Disposable live Studio repro workflow. Delete after validation.

name: "PR 8299 Live Credential Persistence"

on:
  push:
    branches:
      - "pr-8299-live-e2e-ci-20260810"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-studio:
    name: "Studio provider-chat (${{ matrix.os }}, ${{ matrix.browser }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        browser: ["chromium"]
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-live/home
      STUDIO_ARTIFACT_DIR: ${{ github.workspace }}/.studio-live/artifacts/${{ matrix.os }}-${{ matrix.browser }}
      STUDIO_BROWSER: ${{ matrix.browser }}
      OPENAI_API_KEY: ${{ secrets.PR8299_OPENAI_API_KEY }}
      HF_TOKEN: ${{ secrets.PR8299_HF_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Playwright dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "httpx>=0.27,<1" "pillow>=10,<13" "cryptography>=42,<47"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps "${{ matrix.browser }}"
          else
            python -m playwright install "${{ matrix.browser }}"
          fi

      - name: Mask live credentials
        shell: bash
        run: |
          echo "::add-mask::$OPENAI_API_KEY"
          echo "::add-mask::$HF_TOKEN"


      - name: Prepare an existing Studio installation from main
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .studio-live/main-source
          mkdir -p "$UNSLOTH_STUDIO_HOME"
          (cd .studio-live/main-source && bash ./install.sh --local --no-torch)
          printf 'existing-user-marker\n' > "$UNSLOTH_STUDIO_HOME/pr8299-existing-user-marker"


      - name: Install Studio from this branch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_STUDIO_HOME | Out-Null
          & ./install.ps1 --local --no-torch

      - name: Upgrade Studio from this branch twice (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash ./install.sh --local --no-torch
          grep -qx 'existing-user-marker' "$UNSLOTH_STUDIO_HOME/pr8299-existing-user-marker"
          bash ./install.sh --local --no-torch
          grep -qx 'existing-user-marker' "$UNSLOTH_STUDIO_HOME/pr8299-existing-user-marker"
          echo "PASS main-to-PR upgrade and repeated install preserved existing Studio home"

      - name: Launch Studio and run Playwright probe
        shell: bash
        run: |
          python ".github/scripts/pr8299-live-credentials-probe.py"

      - name: Upload Studio probe artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-provider-chat-${{ matrix.os }}-${{ matrix.browser }}
          path: ${{ github.workspace }}/.studio-live/artifacts
          if-no-files-found: warn
