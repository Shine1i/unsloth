# Disposable repro workflow for upstream PR #6520. Delete after validation.

name: "PR 6520 Settings Password Repro"

on:
  push:
    branches:
      - "pr-6520-settings-password-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-password:
    name: "Settings password (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            port: "18920"
            browsers: "chromium,firefox,webkit"
          - os: macos-14
            port: "18921"
            browsers: "chromium,firefox,webkit"
          - os: windows-latest
            port: "18922"
            browsers: "chromium,firefox,webkit,edge"

    env:
      STUDIO_PORT: ${{ matrix.port }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      - name: Windows install speedups
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          npm install -g 'npm@^11' 2>&1 | Out-Host
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth",
            "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules",
            "$env:GITHUB_WORKSPACE\studio\frontend\dist"
          )) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "Defender exclusion skipped ($($_.Exception.Message)): $p"
            }
          }

      - name: Install Studio on Unix (--local, --no-torch)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      - name: Install Studio on Windows (--local, --no-torch)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          & ./install.ps1 --local --no-torch *>&1 | Tee-Object -FilePath logs/install.log

      - name: Add Windows Studio shim to PATH
        if: runner.os == 'Windows'
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          if [ ! -f "$SHIM_DIR/unsloth.exe" ]; then
            echo "::error::unsloth.exe shim not found at $SHIM_DIR"
            ls -la ~/.unsloth/studio/ || true
            exit 1
          fi
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"

      - name: Install Playwright browsers on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'playwright>=1.45'
          python -m playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browsers on macOS/Windows
        if: runner.os != 'Linux'
        run: |
          python -m pip install 'playwright>=1.45'
          python -m playwright install chromium firefox webkit

      - name: Reset auth and boot Studio
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" \
            > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f"http://127.0.0.1:{os.environ['STUDIO_PORT']}/api/health"
          deadline = time.time() + 180
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      body = json.loads(response.read().decode())
                  if response.status == 200 and body.get("status") == "healthy":
                      print(body)
                      raise SystemExit(0)
                  last = body
              except Exception as exc:
                  last = repr(exc)
              time.sleep(1)
          raise SystemExit(f"Studio did not become healthy: {last!r}")
          PY

      - name: Pass bootstrap password
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          echo "::add-mask::$OLD"
          echo "STUDIO_BOOTSTRAP_PW=$OLD" >> "$GITHUB_ENV"

      - name: Drive Settings password dialog repro
        env:
          BASE_URL: http://127.0.0.1:${{ matrix.port }}
          PW_BROWSERS: ${{ matrix.browsers }}
          PW_ART_DIR: logs/settings-password
        run: |
          mkdir -p logs/settings-password
          python tests/studio/playwright_settings_password_repro.py

      - name: Stop Studio
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Upload repro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-6520-settings-password-${{ runner.os }}
          path: |
            logs/install.log
            logs/studio.log
            logs/settings-password
          retention-days: 7
