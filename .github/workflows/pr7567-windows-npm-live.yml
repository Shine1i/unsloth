# Disposable PR 7567 native-Windows live repro. Delete after review.

name: "PR 7567 Windows npm multiline live"

on:
  push:
    branches:
      - "pr-7567-windows-npm-multiline-repro-ci*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-live:
    name: "Windows live (${{ matrix.case_label }})"
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_label: npm10-simple-js
            npm_version: "10.9.4"
            target_style: js
          - case_label: npm12-simple-js
            npm_version: "12.0.2"
            target_style: js
          - case_label: npm10-extensionless
            npm_version: "10.9.4"
            target_style: extensionless
          - case_label: npm10-shebang-args
            npm_version: "10.9.4"
            target_style: shebang-args
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Install focused Python test dependencies"
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --editable . "pytest>=8,<9"

      - name: "Install npm ${{ matrix.npm_version }}"
        shell: pwsh
        run: |
          npm.cmd install --global "npm@${{ matrix.npm_version }}"
          $actual = npm.cmd --version
          Write-Host "npm=$actual"
          if ($actual -ne "${{ matrix.npm_version }}") {
            throw "expected npm ${{ matrix.npm_version }}, got $actual"
          }

      - name: "Run focused npm-shim unit regressions"
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pytest -q unsloth_cli/tests/test_start.py -k "launch_windows_npm_shim or resolved_launch_command"

      - name: "Run native Windows npm-shim launch end to end"
        shell: pwsh
        run: |
          python .github/scripts/pr7567_windows_npm_live.py `
            --case-label "${{ matrix.case_label }}" `
            --target-style "${{ matrix.target_style }}" `
            --expected-npm "${{ matrix.npm_version }}"

      - name: "Upload native launch evidence"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "pr7567-${{ matrix.case_label }}-${{ github.run_attempt }}"
          path: .repro/
          if-no-files-found: warn
          retention-days: 7
